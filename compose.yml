services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: code-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
    volumes:
      - ./.qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: code-graph-db
    environment:
      - NEO4J_AUTH=neo4j/supersecretpassword
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    expose:
      - 7474
      - 7687
    volumes:
      - ./.neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/browser/  || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  mcp-runtime:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mcp-servers-runtime
    command: sleep infinity
    env_file:
      - .env
    depends_on:
      indexer:
        condition: service_completed_successfully

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    env_file:
      - .env
    volumes:
      - "${PROJECT_DIR}:/codebase"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
